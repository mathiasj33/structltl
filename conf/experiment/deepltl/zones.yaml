# @package __global__

defaults:
  - /env: zone_env
  - /alg: deepltl
  - /rl_alg: ppo

model:
  actor:
    __target__: jaxltl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: tanh
    weight_init_scales: [1.414, 1.414, 0.01]
  critic:
    __target__: jaxltl.networks.mlp.MLP
    hidden_sizes: [64, 64]
    activation: tanh
    weight_init_scales: [1.414, 1.414, 1.0]

rl_alg:
  total_timesteps: 5e6
  num_envs: 16
  num_steps: 4096
  num_minibatches: 32
  update_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.003
  vf_coef: 0.5
  lr: 2.5e-4
  max_grad_norm: 0.5
  anneal_lr: true
