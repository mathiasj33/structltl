defaults:
  - experiment: deep_ltl/zones
  - hydra: simple
  - _self_
env:
  use_precomputed_resets: true # setting to true ignores default options
  precomputed_resets_path: sampled_resets_test.eqx

run: deepltl

eval:
  formula: "GF red & GF green"
  model_index: 0
  num_episodes: 8
  deterministic: false
  discount: 0.99

plotting:
  rows: 2
  cols: 4
