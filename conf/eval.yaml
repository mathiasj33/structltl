defaults:
  - experiment: deep_ltl/letter
  - formulas: letter/finite
  - hydra: simple
  - _self_

run: deepltl
env:
  use_precomputed_resets: true # setting to true ignores default options
  precomputed_resets_path: sampled_resets_test.eqx
eval:
  num_episodes: 8
  deterministic: false
  discount: 0.94
plotting:
  plot: true
  num_trajectories: 8
  rows: 2
  cols: 4
formulas:
  - "(F d) & (!f U (d & F b))"
